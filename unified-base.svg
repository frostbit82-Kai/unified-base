<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2030"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- The tab bar: one tab picked, the rest dimmed. -->
  <rect x="18" y="18" width="30" height="10" rx="3" fill="#e8ecf4"/>
  <rect x="52" y="18" width="24" height="10" rx="3" fill="#e8ecf4" opacity="0.28"/>
  <rect x="80" y="18" width="18" height="10" rx="3" fill="#e8ecf4" opacity="0.28"/>
  <!-- Four programs side by side in one window, one colour each. -->
  <rect x="18" y="34" width="44" height="36" rx="6" fill="#3fb8af"/>
  <rect x="66" y="34" width="44" height="36" rx="6" fill="#7c6cf0"/>
  <rect x="18" y="74" width="44" height="36" rx="6" fill="#f2b134"/>
  <rect x="66" y="74" width="44" height="36" rx="6" fill="#ef6f6c"/>
</svg>
