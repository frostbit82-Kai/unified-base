<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Node.js / Electron — Unified Base demo</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --card: rgba(255, 255, 255, 0.05);
      --stroke: rgba(255, 255, 255, 0.12);
      --text: #e8ecf6;
      --muted: #8b93a7;
      --accent: #7cf5d5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated aurora gradient backdrop */
    .aurora {
      position: fixed;
      inset: -30%;
      z-index: 0;
      background:
        radial-gradient(40% 40% at 20% 30%, #1b3a6b 0%, transparent 60%),
        radial-gradient(45% 45% at 80% 25%, #3a1b6b 0%, transparent 60%),
        radial-gradient(50% 50% at 50% 85%, #0f5c4d 0%, transparent 60%),
        radial-gradient(35% 35% at 70% 70%, #6b1b45 0%, transparent 60%);
      filter: blur(20px) saturate(1.2);
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate(-4%, -3%) scale(1.05) rotate(0deg); }
      50%  { transform: translate(3%, 2%) scale(1.15) rotate(3deg); }
      100% { transform: translate(4%, -2%) scale(1.08) rotate(-2deg); }
    }

    .stage {
      position: relative;
      z-index: 1;
      width: min(760px, 90vw);
      padding: 40px;
      border: 1px solid var(--stroke);
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 22px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    h1 {
      font-size: clamp(26px, 4.5vw, 40px);
      line-height: 1.15;
      background: linear-gradient(100deg, #7cf5d5, #7ca8f5 45%, #d67cf5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 220px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--stroke);
      margin-bottom: 24px;
    }

    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(30px, 6vw, 48px);
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .date {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="aurora"></div>

  <main class="stage">
    <span class="badge"><span class="dot"></span> Electron · Unified Base</span>
    <h1>Node.js / Electron — Unified Base demo</h1>
    <canvas id="scene" width="680" height="220"></canvas>
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">&nbsp;</div>
  </main>

  <script>
    // ---- Live clock ----
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');

    function tick() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], { hour12: false });
      dateEl.textContent = now.toLocaleDateString([], {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    tick();
    setInterval(tick, 1000);

    // ---- Bouncing shapes on canvas (requestAnimationFrame) ----
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const colors = ['#7cf5d5', '#7ca8f5', '#d67cf5', '#f5cd7c'];
    const balls = Array.from({ length: 5 }, (_, i) => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() * 2 + 1.2) * (Math.random() < 0.5 ? -1 : 1),
      vy: (Math.random() * 2 + 1.2) * (Math.random() < 0.5 ? -1 : 1),
      r: 14 + Math.random() * 16,
      c: colors[i % colors.length]
    }));

    let trail = [];

    function frame() {
      ctx.fillStyle = 'rgba(11, 15, 26, 0.28)';
      ctx.fillRect(0, 0, W, H);

      for (const b of balls) {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < b.r || b.x > W - b.r) b.vx *= -1;
        if (b.y < b.r || b.y > H - b.r) b.vy *= -1;

        const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
        grad.addColorStop(0, b.c);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // connect nearby shapes with faint lines
      ctx.lineWidth = 1;
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const dx = balls[i].x - balls[j].x;
          const dy = balls[i].y - balls[j].y;
          const d = Math.hypot(dx, dy);
          if (d < 160) {
            ctx.strokeStyle = 'rgba(124, 168, 245, ' + (1 - d / 160) * 0.4 + ')';
            ctx.beginPath();
            ctx.moveTo(balls[i].x, balls[i].y);
            ctx.lineTo(balls[j].x, balls[j].y);
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
