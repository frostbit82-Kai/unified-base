name: Release

# A v* tag builds both installers from that commit and makes a DRAFT release:
# download them, try them on a real machine, then press Publish. Run it by
# hand (Actions > Release > Run workflow) to build the installers as workflow
# artifacts without making a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 22.04's glibc is 2.35, the package's GLIBC_MAX; the build checks the floor.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.2.0
      # What Qt's offscreen platform needs for test_core; the package does not ship these.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: bash installer/build_linux.sh
      - uses: actions/upload-artifact@v7
        with: { name: linux, path: installer/dist/*.tar.gz, if-no-files-found: error }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v10.2.0
      - run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: python installer/build_windows.py
      - uses: actions/upload-artifact@v7
        with: { name: windows, path: installer/dist/*-setup.exe, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v="$(cat VERSION)"
          [ "$TAG" = "v$v" ] || { echo "Tag $TAG does not match VERSION $v" >&2; exit 1; }
          cd dist
          # Version-free names: /releases/latest/download/<name> then always
          # works, and the website links straight to it.
          mv "UnifiedBase-$v-linux-x86_64.tar.gz" UnifiedBase-linux-x86_64.tar.gz
          mv "UnifiedBase-$v-windows-x64-setup.exe" UnifiedBase-windows-x64-setup.exe
          sha256sum UnifiedBase-* > SHA256SUMS.txt
          { cat ../.github/release-notes.md; printf '\n```\n'; cat SHA256SUMS.txt; printf '```\n'; } > notes.md
          gh release create "$TAG" --draft --title "Unified Base $v" --notes-file notes.md \
            UnifiedBase-linux-x86_64.tar.gz UnifiedBase-windows-x64-setup.exe SHA256SUMS.txt
